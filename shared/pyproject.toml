[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-fantasy-shared"
version = "0.1.0"
description = "Shared models, data providers, reconciliation and scoring for the NBA fantasy Draft Advisor and Fantasy Tracker"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "requests>=2",
    "nba_api>=1.9",
]

[tool.setuptools.packages.find]
include = ["nba_fantasy_shared*"]
